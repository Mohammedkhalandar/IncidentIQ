name: IncidentIQ CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test backend
        working-directory: backend
        run: mvn --batch-mode verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Build frontend
        working-directory: frontend
        run: npm run build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start isolated application stack
        run: docker compose -p incidentiq-e2e up --build -d
      - name: Wait for application readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8081/actuator/health && curl --fail --silent http://localhost:5173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p incidentiq-e2e logs --tail=200
          exit 1
      - name: Run browser journeys
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: npm run test:e2e
      - name: Stop isolated application stack
        if: always()
        run: docker compose -p incidentiq-e2e down --volumes --remove-orphans
