server:
  port: 8080
spring:
  application:
    name: incidentiq
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/incidentiq?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  jwt:
    secret: ${JWT_SECRET:local-only-change-this-secret-to-at-least-32-bytes-incidentiq}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed-demo-data: ${SEED_DEMO_DATA:true}
